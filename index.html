<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公民閱讀小偵探</title><style>:root{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#203047;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#174b70;color:white;padding:24px max(20px,calc((100vw - 900px)/2))}h1{margin:0 0 8px;font-size:2rem}main{max-width:900px;margin:24px auto;padding:0 16px 50px}.card{background:white;border:1px solid #dce4ed;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 4px 16px #152c4710}p,li{line-height:1.9;font-size:1.12rem}button{font:inherit;cursor:pointer;border:2px solid #17648b;background:#17648b;color:white;padding:11px 17px;border-radius:12px;margin:5px 5px 5px 0;min-height:46px}button.secondary{background:white;color:#174b70}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:4px solid #e9a934;outline-offset:2px}.nav{display:flex;flex-wrap:wrap;gap:6px}.nav button.active{background:#f7c75b;color:#18334b;border-color:#f7c75b}.tag{background:#e8f3fb;color:#164f73;border-radius:6px;padding:4px 9px;font-weight:700}.text{background:#f5f8fc;border-left:5px solid #3b83a7;padding:16px 20px;border-radius:10px;font-size:1.2rem;line-height:2.15}.choice{display:block;width:100%;text-align:left;background:white;color:#18334b;border-color:#b9cad9}.choice:hover{background:#eaf5fc}.good{background:#e9f8ee;border-left:5px solid #248049;padding:12px;border-radius:8px}.note{background:#fff5df;border-left:5px solid #d49a21;padding:12px;border-radius:8px}.small{font-size:.95rem;color:#526479}.mark{background:#ffe68b;padding:2px 3px;border-radius:4px}.word{display:inline-block;padding:12px 18px;background:#f0f7fc;border-radius:12px;margin:6px;border:1px solid #b5d1e3}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.progress{height:12px;border-radius:10px;background:#dfe8f0;overflow:hidden}.bar{height:100%;background:#2d83a3;transition:width .3s}select{font:inherit;padding:10px;border:1px solid #9eb2c6;border-radius:9px}footer{color:#556b7b;font-size:.9rem;text-align:center;padding:15px} @media(max-width:600px){h1{font-size:1.6rem}.card{padding:16px}button{width:100%}}</style></head><body><header><h1>🔎 公民閱讀小偵探</h1><div>閱讀市民來信，練習認字、找重點、尋找線索！</div></header><main><div class="card"><div class="row"><strong id="stageLabel">閱讀任務</strong><span class="tag" id="progressText">0 / 4</span></div><div class="progress"><div class="bar" id="progressBar" style="width:0%"></div></div><div class="nav" id="nav"></div></div><section id="content" aria-live="polite"></section></main><footer>本遊戲使用預設教學內容與規則式提示，並未連接生成式 AI。語音功能依瀏覽器支援情況運作。</footer><script>
const story='小明家附近的公園有許多遊樂設施。最近，有些設施損壞，讓居民感到不方便。居民向市政府反映，希望能盡快修理。市政府收到意見後，安排人員檢查設施，並評估修繕需要多少預算。';
const transfer='學校附近的路燈壞了。晚上經過的居民看不清楚道路，擔心發生危險。居民向市政府反映，希望能盡快修好路燈。';
let stage=0,hints=0,tries=0,results=[],wordIndex=0,readCount=0,selectedWords=new Set(),targetWord='';const names=['開始任務','詞彙探索員','重點偵探','線索推理家','獨立挑戰'];
const el=()=>document.getElementById('content');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音朗讀。');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.78;speechSynthesis.speak(u)}
function log(kind,correct){results.push({stage:names[stage],kind,correct,hints,tries,time:new Date().toLocaleTimeString('zh-TW')})}
function button(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function render(){document.getElementById('stageLabel').textContent=names[stage];document.getElementById('progressText').textContent=`${stage} / 4`;document.getElementById('progressBar').style.width=(stage*25)+'%';document.getElementById('nav').innerHTML=names.map((n,i)=>`<button class="${i===stage?'active':'secondary'}" onclick="go(${i})">${i===0?'🏠 ':i===1?'📚 ':i===2?'🖍️ ':i===3?'🧩 ':'🌱 '}${n}</button>`).join('');if(stage===0)home();if(stage===1)words();if(stage===2)detective();if(stage===3)reason();if(stage===4)independent()}
function go(n){stage=n;hints=0;tries=0;render();scrollTo({top:0,behavior:'smooth'})}
function home(){el().innerHTML=`<div class="card"><h2>歡迎來到市民服務中心！</h2><p>今天，你要幫忙閱讀市民的來信。每一關都會教你一個閱讀方法。</p><div class="row"><span class="tag">第一關：認識詞語</span><span class="tag">第二關：找出重點</span><span class="tag">第三關：根據線索推理</span></div><p>你可以自己先試試看，遇到困難再按「給我提示」。</p>${button('開始第一關','go(1)')}</div><div class="card"><h3>教師教學建議</h3><p>先示範讀詞、重讀和找關鍵字，再讓學生練習。語音是支持工具；朗讀正確性需另外觀察。可用遊戲紀錄了解答題與提示情況。</p></div>`}
const vocab=[{w:'居民',m:'住在某個地方的人',options:['住在某個地方的人','負責修理機器的人','公園裡的遊具'],sentence:'居民向市政府反映。'},{w:'設施',m:'提供人們使用的設備',options:['一種天氣','提供人們使用的設備','一張地圖'],sentence:'公園有許多遊樂設施。'},{w:'修繕',m:'把損壞的東西修理好',options:['把東西丟掉','把東西借出去','把損壞的東西修理好'],sentence:'市政府安排修繕設施。'},{w:'預算',m:'事先規劃可以使用多少錢',options:['事先規劃可以使用多少錢','居民的住址','公園的開放時間'],sentence:'市政府評估修繕預算。'}];
function words(){const v=vocab[wordIndex];el().innerHTML=`<div class="card"><h2>📚 第一關：詞彙探索員</h2><p>任務：先看詞語、聽讀音，再選出正確意思。</p><div class="word" style="font-size:2rem;font-weight:700">${v.w}</div><div>${button('🔊 聽詞語',`speak('${v.w}')`,'secondary')}${button('🔊 聽例句',`speak('${v.sentence}')`,'secondary')}</div><p class="small">第 ${wordIndex+1} / ${vocab.length} 個詞語</p><h3>「${v.w}」是什麼意思？</h3><div id="options">${v.options.map((o,i)=>`<button class="choice" onclick="answerWord(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div id="help">${button('💡 給我提示','hintWord()','secondary')}</div></div>`}
function hintWord(){hints++;document.getElementById('help').innerHTML=`<div class="note">試著想想這個詞語出現在什麼生活情境。${hints>=2?' 例句：'+vocab[wordIndex].sentence:''}</div>${button('再給我一點提示','hintWord()','secondary')}`}
function answerWord(i){tries++;const v=vocab[wordIndex],ok=v.options[i]===v.m;log('詞義配對：'+v.w,ok);if(ok){document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML=`<div class="good">答對了！「${v.w}」是「${v.m}」。</div>${button(wordIndex===3?'進入第二關':'下一個詞語','nextWord()')}`;}else{document.getElementById('feedback').innerHTML='<div class="note">還沒答對。先聽一次例句，再想想詞語的意思。</div>'}}
function nextWord(){hints=0;tries=0;if(wordIndex<3){wordIndex++;words()}else go(2)}
function detective(){const prompts=[{q:'誰向市政府反映？',a:'居民',opts:['小明的老師','居民','遊樂設施'],e:'居民向市政府反映'},{q:'公園發生什麼問題？',a:'遊樂設施損壞',opts:['遊樂設施損壞','公園舉辦活動','公園要搬家'],e:'有些設施損壞'},{q:'居民希望怎麼處理？',a:'盡快修理',opts:['增加門票','盡快修理','拆掉所有公園'],e:'希望能盡快修理'}];window.prompts=prompts;let n=window.detN||0,p=prompts[n];el().innerHTML=`<div class="card"><h2>🖍️ 第二關：重點偵探</h2><p>閱讀時可以找出「誰、發生什麼事、希望怎麼做」。</p><div class="text" id="story">${story}</div><div class="row">${button('🔊 聽整段','speak(story)','secondary')}${button('分段閱讀','chunk()','secondary')}${button('標示重點','highlight()','secondary')}</div><p class="small">第 ${n+1} / 3 題</p><h3>${p.q}</h3><div id="options">${p.opts.map((o,i)=>`<button class="choice" onclick="answerDetect(${i})">${o}</button>`).join('')}</div><div id="feedback"></div><div id="help">${button('💡 給我提示','hintDetect()','secondary')}</div></div>`}
function chunk(){document.getElementById('story').innerHTML=story.replaceAll('。','。<hr style="border:0;border-top:1px solid #dce4ed">')}
function highlight(){const p=prompts[window.detN||0];document.getElementById('story').innerHTML=story.replace(p.e,`<span class="mark">${p.e}</span>`)}
function hintDetect(){hints++;let msg=hints===1?'先想一想：問題問的是人物、事件，還是需求？':hints===2?'請重新閱讀提到「居民」或「設施」的句子。':'按「標示重點」看看相關文字。';document.getElementById('help').innerHTML=`<div class="note">${msg}</div>${button('再給我一點提示','hintDetect()','secondary')}`}
function answerDetect(i){const p=prompts[window.detN||0],ok=p.opts[i]===p.a;tries++;log('擷取重點：'+p.q,ok);if(ok){document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML=`<div class="good">答對了！文章中的線索是：「${p.e}」。</div>${button((window.detN||0)===2?'進入第三關':'下一題','nextDetect()')}`;}else document.getElementById('feedback').innerHTML='<div class="note">再讀一次文章，找找問題問的那個資訊。</div>'}
function nextDetect(){hints=0;tries=0;window.detN=(window.detN||0)+1;if(window.detN>2){window.detN=0;go(3)}else detective()}
function reason(){el().innerHTML=`<div class="card"><h2>🧩 第三關：線索推理家</h2><p>閱讀文章，想想市政府為什麼要先檢查設施。</p><div class="text" id="story">${story}</div>${button('🔊 聽文章','speak(story)','secondary')}<h3>為什麼市政府要先檢查設施，再評估預算？</h3><div id="options">${['因為要先了解損壞情況，才能估算修理費用','因為公園要改成停車場','因為居民不喜歡公園'].map((o,i)=>`<button class="choice" onclick="answerReason(${i})">${o}</button>`).join('')}</div><div id="feedback"></div><div id="help">${button('💡 給我提示','hintReason()','secondary')}</div></div>`}
function hintReason(){hints++;const arr=['先找出文章裡「檢查」與「預算」的句子。','想想：如果不知道哪些東西壞掉，能先知道要花多少錢嗎？','線索：「安排人員檢查設施，並評估修繕需要多少預算。」'];document.getElementById('help').innerHTML=`<div class="note">${arr[Math.min(hints-1,2)]}</div>${button('再給我一點提示','hintReason()','secondary')}`}
function answerReason(i){tries++;const ok=i===0;log('文本推論',ok);if(ok){document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML=`<div class="good">答對了！你利用文章線索推想了原因。</div>${button('進入獨立挑戰','go(4)')}`}else document.getElementById('feedback').innerHTML='<div class="note">再找找「檢查設施」與「評估預算」之間的關係。</div>'}
function independent(){el().innerHTML=`<div class="card"><h2>🌱 獨立閱讀挑戰</h2><p>這次先試著自己讀，不提供提示。若有需要仍可使用語音支持，但要記錄。</p><div class="text">${transfer}</div>${button('🔊 需要語音協助','speak(transfer);log("獨立挑戰使用語音",true)','secondary')}<h3>居民為什麼希望修好路燈？</h3><div id="options">${['因為路燈太漂亮','因為晚上看不清道路，可能有危險','因為居民想要新的公園'].map((o,i)=>`<button class="choice" onclick="answerIndependent(${i})">${o}</button>`).join('')}</div><div id="feedback"></div></div><div class="card"><h3>閱讀策略回顧</h3><p>今天你用過哪些方法？</p><label><input type="checkbox"> 重讀不懂的句子</label><p><label><input type="checkbox"> 找關鍵字</label></p><label><input type="checkbox"> 回文章找證據</label></div><div class="card"><h3>教師紀錄</h3><p class="small">僅保存在此頁面執行期間，重新整理即清除；不會上傳資料。</p>${button('匯出本次學習紀錄','exportCSV()','secondary')}${button('重新開始','reset()','secondary')}</div>`}
function answerIndependent(i){tries++;const ok=i===1;log('獨立短文理解',ok);document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML=`<div class="${ok?'good':'note'}">${ok?'答對了！你從文章中找到了原因。':'這題還沒答對。請再閱讀「晚上經過的居民」那一句。'}<p>完成閱讀任務！你可以回顧今天學到的閱讀方法。</p></div>`}
function exportCSV(){const rows=[['關卡','任務','正確','提示次數','作答次數','時間'],...results.map(r=>[r.stage,r.kind,r.correct?'是':'否',r.hints,r.tries,r.time])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='閱讀遊戲學習紀錄.csv';a.click();URL.revokeObjectURL(a.href)}
function reset(){results=[];wordIndex=0;window.detN=0;go(0)}render();
</script></body></html>
